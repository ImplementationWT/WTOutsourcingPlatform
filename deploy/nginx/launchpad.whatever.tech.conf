server {
    listen 80;
    listen [::]:80;
    server_name launchpad.whatever.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name launchpad.whatever.tech;

    ssl_certificate     /etc/letsencrypt/live/launchpad.whatever.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/launchpad.whatever.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend (Vite build). deploy/activate.sh cambia el symlink en cada release.
    root /var/www/launchpad/current;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API Fastify (contenedor launchpad-api, escucha en 127.0.0.1:3001).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/jobs/:id/events es un stream (SSE): sin buffering y con lecturas largas.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Webhook de Read.ai: trae la transcripción completa de la reunión (la API acepta hasta 6 MB;
    # el resto de /api/ queda con el límite por defecto de nginx).
    location = /api/webhooks/read-ai {
        client_max_body_size 6m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001/health;
    }
}
