# Generado por /opt/platform/bin/install-client para @@HOST@@. No editar a mano:
# se reescribe en cada instalación. El bloque "location /" es el del contrato del template (§6).
server {
    listen 80;
    listen [::]:80;
    server_name @@HOST@@;

    # Renovación del certificado (certbot --webroot).
    location ^~ /.well-known/acme-challenge/ {
        root @@WEBROOT@@;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @@HOST@@;

    ssl_certificate     @@LIVE@@/@@HOST@@/fullchain.pem;
    ssl_certificate_key @@LIVE@@/@@HOST@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:platform_apps_ssl:10m;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:@@PORT@@;
        proxy_set_header Host $host;                                   # obligatorio
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
