# Generado por /opt/platform/bin/preview-install para @@HOST@@ (vista previa del AI Developer
# de @@SLUG@@). No editar a mano. Solo entra quien trae un pase de Launchpad: nginx valida la
# cookie lp_preview con la API del panel (auth_request) en cada petición.
server {
    listen 80;
    listen [::]:80;
    server_name @@HOST@@;

    location ^~ /.well-known/acme-challenge/ {
        root @@WEBROOT@@;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name @@HOST@@;

    ssl_certificate     @@LIVE@@/@@HOST@@/fullchain.pem;
    ssl_certificate_key @@LIVE@@/@@HOST@@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:platform_apps_ssl:10m;

    client_max_body_size 10m;

    # Canje del pase del iframe por la cookie de este host (lo resuelve Launchpad).
    location = /__launchpad/auth {
        proxy_pass @@PANEL_UPSTREAM@@/api/ai/preview/auth$is_args$args;
        proxy_set_header X-Preview-Host $host;
        proxy_set_header Cookie "";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /__launchpad/check {
        internal;
        proxy_pass @@PANEL_UPSTREAM@@/api/ai/preview/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Preview-Host $host;
        proxy_set_header X-Preview-Pass $cookie_lp_preview;
        proxy_set_header Cookie "";
    }

    # Liveness del contenedor (no toca datos): la usa la plataforma sin pase.
    location = /health {
        proxy_pass http://127.0.0.1:@@PORT@@;
        proxy_set_header Host $host;
    }

    location @private {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 401 "Vista previa privada: abrela desde Launchpad (AI Developer).\n";
    }

    location @stopped {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 503 "La vista previa esta detenida. Iniciala de nuevo desde Launchpad.\n";
    }

    location / {
        auth_request /__launchpad/check;
        error_page 401 403 = @private;
        error_page 502 504 = @stopped;

        proxy_pass http://127.0.0.1:@@PORT@@;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Se muestra embebida en el panel: solo Launchpad puede enmarcarla.
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors @@PANEL_ORIGIN@@" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
