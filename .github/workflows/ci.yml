name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main pasa por deploy.yml, que reutiliza este workflow.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "12.11.2"

jobs:
  web:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  api:
    name: API (lint + typecheck + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/api/pnpm-lock.yaml
      # mongodb-memory-server descarga mongod la primera vez.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('apps/api/pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Carga dist/ con Node (no con vitest): detecta imports que solo fallan al arrancar.
      - run: pnpm check:dist

  server-scripts:
    name: Scripts del VPS (shellcheck + pruebas en contenedor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          docker run --rm -e LANG=C.UTF-8 -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 \
            -x --source-path=SCRIPTDIR -s bash deploy/platform/bin/* deploy/platform/lib/common.sh \
            deploy/platform/tests/entrypoint.sh deploy/platform/tests/run.sh deploy/platform/tests/stubs/certbot
      # Contenedor propio (Docker, nginx, certbot simulado y registro local): no toca ningún servidor.
      - name: Pruebas de bootstrap-vps.sh, install-client, deploy-client y provisioner-dispatch
        run: deploy/platform/tests/run.sh
